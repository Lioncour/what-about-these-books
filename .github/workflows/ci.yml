name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Launches the desktop app on the standalone build, from a copy outside the repo so
      # it can't borrow modules from node_modules: port pick, window, API, clean quit.
      - name: Desktop smoke test
        run: xvfb-run -a node scripts/electron-smoke.mjs --prod
